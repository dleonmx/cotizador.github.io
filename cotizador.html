<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cotizador — Electricista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121319;
    --panel:#1B1D24;
    --panel-alt:#232631;
    --border:#31343F;
    --text:#F2F2ED;
    --text-dim:#9A9DA8;
    --accent:#FFC72C;
    --accent-dark:#C9970A;
    --accent-ink:#1A1400;
    --lcd-bg:#0B1A10;
    --lcd-text:#4ADE80;
    --danger:#FF6B6B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:132px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 0;}

  /* Header */
  header{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:18px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);
  }
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:800;
    font-size:30px;margin:0;line-height:1;letter-spacing:.01em;
  }
  .base-rate{
    margin-top:6px;font-size:13px;color:var(--text-dim);display:flex;gap:6px;align-items:center;
  }
  .base-rate button{
    background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;
  }
  .gear-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .gear-btn:active{background:var(--panel-alt);}
  .gear-btn svg{width:20px;height:20px;}

  /* Quick grid */
  .section-label{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;font-size:13px;color:var(--text-dim);margin:0 0 10px 2px;
  }
  .quick-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;margin-bottom:24px;
  }
  .quick-chip{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 12px;text-align:left;cursor:pointer;color:var(--text);
    display:flex;flex-direction:column;gap:6px;transition:transform .08s ease, border-color .08s ease;
  }
  .quick-chip:active{transform:scale(.97);border-color:var(--accent);}
  .quick-chip .qname{font-weight:600;font-size:14.5px;line-height:1.25;}
  .quick-chip .qprice{
    font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);
  }

  /* Quote list */
  .quote-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .empty-state{
    border:1.5px dashed var(--border);border-radius:var(--radius);padding:28px 16px;
    text-align:center;color:var(--text-dim);font-size:14px;
  }
  .line-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;
  }
  .li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .li-name{font-weight:600;font-size:15.5px;}
  .li-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.danger{color:var(--danger);}

  .li-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;gap:10px;font-size:13.5px;color:var(--text-dim);
  }
  .li-row .val-input{
    background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'Space Mono',monospace;font-size:14px;
    padding:6px 8px;width:88px;text-align:right;
  }
  .li-row .val-input:focus{outline:none;border-color:var(--accent);}

  .toggle-group{display:flex;background:var(--panel-alt);border-radius:8px;padding:3px;border:1px solid var(--border);}
  .toggle-opt{
    border:none;background:none;color:var(--text-dim);font-size:12.5px;font-weight:600;
    padding:6px 10px;border-radius:6px;cursor:pointer;
  }
  .toggle-opt.active{background:var(--accent);color:var(--accent-ink);}

  .qty-stepper{display:flex;align-items:center;gap:8px;}
  .qty-stepper button{
    width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel-alt);color:var(--text);font-size:15px;cursor:pointer;line-height:1;
  }
  .qty-stepper span{font-family:'Space Mono',monospace;font-size:14px;min-width:16px;text-align:center;}

  .detail-toggle{
    margin-top:10px;background:none;border:none;color:var(--accent);font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;
  }
  .detail-body{display:none;flex-direction:column;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
  .detail-body.open{display:flex;}

  .li-subtotal{
    margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;font-size:13.5px;
  }
  .li-subtotal b{font-family:'Space Mono',monospace;color:var(--text);}

  .material-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .material-chip{
    background:var(--panel-alt);border:1px solid var(--border);border-radius:20px;
    padding:6px 12px;font-size:12.5px;color:var(--text);cursor:pointer;
    display:flex;gap:6px;align-items:center;font-family:'Inter',sans-serif;
  }
  .material-chip .mc-price{font-family:'Space Mono',monospace;color:var(--accent);font-size:12px;}
  .material-chip.active{border-color:var(--accent);background:rgba(255,199,44,.14);}
  .material-hint{font-size:11.5px;color:var(--text-dim);margin-top:8px;}

  /* Sticky bottom bar */
  .bottom-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--panel);border-top:1px solid var(--border);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,.35);
  }
  .bottom-inner{max-width:520px;margin:0 auto;}
  .lcd{
    background:var(--lcd-bg);border-radius:10px;padding:10px 14px;
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
    border:1px solid #0F2A18;
  }
  .lcd .lcd-label{
    font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#3E8F58;
  }
  .lcd .lcd-value{
    font-family:'Space Mono',monospace;font-weight:700;font-size:28px;color:var(--lcd-text);
    text-shadow:0 0 8px rgba(74,222,128,.35);
  }
  .bar-actions{display:flex;gap:10px;}
  .btn{
    flex:1;border:none;border-radius:10px;padding:13px 10px;font-weight:700;font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-ghost{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);flex:0 0 auto;padding:13px 14px;}

  /* Settings modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    border:1px solid var(--border);border-bottom:none;
  }
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{
    font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;margin:0 0 14px;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:11px 12px;font-size:15px;font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .service-row{
    display:flex;gap:8px;align-items:center;margin-bottom:8px;
    background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;padding:8px 10px;
  }
  .service-row input[type=text]{flex:1;background:none;border:none;color:var(--text);font-size:14px;padding:4px;}
  .service-row input[type=number]{
    width:78px;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    color:var(--text);font-family:'Space Mono',monospace;padding:6px 8px;font-size:13.5px;text-align:right;
  }
  .service-row input:focus{outline:none;}
  .add-service{
    display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--border);
  }
  .add-service input[type=text]{flex:1;}
  .add-service input[type=number]{width:78px;}
  .sheet-footer{display:flex;gap:10px;margin-top:18px;}

  .toast{
    position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;
    padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">Servicio eléctrico</span>
      <h1>Cotizador</h1>
      <div class="base-rate">
        Tarifa básica: <b id="baseRateDisplay" style="color:var(--text)">$0</b>
        <button id="editBaseRateBtn">editar</button>
      </div>
    </div>
    <button class="gear-btn" id="openSettingsBtn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>

  <div class="section-label">Agregar servicio</div>
  <div class="quick-grid" id="quickGrid"></div>

  <div class="section-label">Cotización actual</div>
  <div class="quote-list" id="quoteList">
    <div class="empty-state" id="emptyState">Toca un servicio arriba para empezar</div>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="lcd">
      <span class="lcd-label">Total</span>
      <span class="lcd-value" id="totalDisplay">$0</span>
    </div>
    <div class="bar-actions">
      <button class="btn btn-primary" id="copyBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.472 3.517a10.5 10.5 0 1 0-14.955 14.955L2 21l2.528-.517A10.5 10.5 0 0 0 17.472 3.517Z"/></svg>
        Copiar para WhatsApp
      </button>
      <button class="btn btn-ghost" id="resetBtn" aria-label="Nueva cotización">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Ajustes</h2>

    <div class="field">
      <label>Tarifa básica / visita ($)</label>
      <input type="number" id="baseRateInput" inputmode="decimal">
    </div>

    <div class="field">
      <label>Servicios</label>
      <div id="servicesEditList"></div>
      <div class="add-service">
        <input type="text" id="newServiceName" placeholder="Nombre del servicio">
        <input type="number" id="newServicePrice" placeholder="$" inputmode="decimal">
        <button class="icon-btn" id="addServiceBtn" aria-label="Agregar" style="color:var(--accent)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Materiales frecuentes</label>
      <div id="materialsEditList"></div>
      <div class="add-service">
        <input type="text" id="newMaterialName" placeholder="Ej. Contacto Quasar">
        <input type="number" id="newMaterialPrice" placeholder="$" inputmode="decimal">
        <button class="icon-btn" id="addMaterialBtn" aria-label="Agregar" style="color:var(--accent)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="sheet-footer">
      <button class="btn btn-primary" id="saveSettingsBtn">Guardar</button>
      <button class="btn btn-ghost" id="closeSettingsBtn">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const DEFAULT_CONFIG = {
    baseRate: 150,
    services: [
      {id:'s1', name:'Cambio de contacto', price:150},
      {id:'s2', name:'Instalación de lámpara', price:200},
      {id:'s3', name:'Extensión con canaleta (por metro)', price:120},
      {id:'s4', name:'Cambio de apagador', price:130}
    ],
    materials: []
  };

  const RESET_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>';

  let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  let quote = []; // {id, name, laborPrice, qty, materialMode:'cliente'|'yo', materialCost, materialName, detailOpen}
  let lineCounter = 0;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + (Math.round(n*100)/100).toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:2});

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  // ---------- Storage ----------
  async function loadConfig(){
    try{
      const res = await window.storage.get('config', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && parsed.baseRate !== undefined && Array.isArray(parsed.services)){
          config = parsed;
          if(!Array.isArray(config.materials)) config.materials = [];
        }
      }
    }catch(e){
      // no config saved yet, use defaults
    }
    render();
  }

  async function saveConfig(){
    try{
      await window.storage.set('config', JSON.stringify(config), false);
    }catch(e){
      showToast('No se pudo guardar. Intenta de nuevo.');
    }
  }

  // ---------- Render ----------
  function render(){
    $('baseRateDisplay').textContent = fmt(config.baseRate);
    renderQuickGrid();
    renderQuoteList();
    renderTotal();
  }

  function renderQuickGrid(){
    const grid = $('quickGrid');
    grid.innerHTML = '';
    config.services.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'quick-chip';
      btn.innerHTML = `<span class="qname">${escapeHtml(s.name)}</span><span class="qprice">${fmt(s.price)}</span>`;
      btn.addEventListener('click', () => addLine(s));
      grid.appendChild(btn);
    });
  }

  function addLine(service){
    lineCounter++;
    quote.push({
      id: 'l' + lineCounter,
      name: service.name,
      laborPrice: service.price,
      qty: 1,
      materialMode: 'cliente',
      materialCost: 0,
      materialName: '',
      detailOpen: false
    });
    renderQuoteList();
    renderTotal();
  }

  function lineSubtotal(line){
    return (line.laborPrice * line.qty) + (line.materialMode === 'yo' ? Number(line.materialCost||0) : 0);
  }

  function renderQuoteList(){
    const list = $('quoteList');
    if(quote.length === 0){
      list.innerHTML = '<div class="empty-state" id="emptyState">Toca un servicio arriba para empezar</div>';
      return;
    }
    list.innerHTML = '';
    quote.forEach(line => {
      const el = document.createElement('div');
      el.className = 'line-item';
      el.innerHTML = `
        <div class="li-top">
          <div class="li-name">${escapeHtml(line.name)}</div>
          <div class="li-actions">
            <button class="icon-btn danger" data-action="delete" aria-label="Eliminar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>

        <div class="li-row">
          <span>Mano de obra</span>
          <input type="number" inputmode="decimal" class="val-input" data-field="laborPrice" value="${line.laborPrice}">
        </div>

        <div class="li-row">
          <span>Material</span>
          <div class="toggle-group">
            <button class="toggle-opt ${line.materialMode==='cliente'?'active':''}" data-action="mat-cliente">Cliente</button>
            <button class="toggle-opt ${line.materialMode==='yo'?'active':''}" data-action="mat-yo">Yo pongo</button>
          </div>
        </div>
        ${line.materialMode === 'yo' ? `
        ${config.materials.length > 0 ? `
        <div class="material-chip-row" data-role="material-chips">
          ${config.materials.map(m => `
            <button type="button" class="material-chip ${line.materialName === m.name ? 'active' : ''}" data-action="pick-material" data-mat-id="${m.id}">
              <span>${escapeHtml(m.name)}</span><span class="mc-price">${fmt(m.price)}</span>
            </button>
          `).join('')}
        </div>` : `<div class="material-hint">Agrega tus materiales frecuentes en ⚙ Ajustes para elegirlos con un toque.</div>`}
        <div class="li-row">
          <span>${line.materialName ? escapeHtml(line.materialName) : 'Costo material'}</span>
          <input type="number" inputmode="decimal" class="val-input" data-field="materialCost" value="${line.materialCost}">
        </div>` : ''}

        <button class="detail-toggle" data-action="toggle-detail">
          ${line.detailOpen ? '▴ Ocultar detalle' : '▾ Ajustar detalle'}
        </button>
        <div class="detail-body ${line.detailOpen ? 'open' : ''}">
          <div class="li-row">
            <span>Cantidad</span>
            <div class="qty-stepper">
              <button data-action="qty-minus">−</button>
              <span>${line.qty}</span>
              <button data-action="qty-plus">+</button>
            </div>
          </div>
        </div>

        <div class="li-subtotal">
          <span>Subtotal</span>
          <b>${fmt(lineSubtotal(line))}</b>
        </div>
      `;

      el.querySelector('[data-action="delete"]').addEventListener('click', () => {
        quote = quote.filter(l => l.id !== line.id);
        renderQuoteList(); renderTotal();
      });
      el.querySelector('[data-action="mat-cliente"]').addEventListener('click', () => {
        line.materialMode = 'cliente'; renderQuoteList(); renderTotal();
      });
      el.querySelector('[data-action="mat-yo"]').addEventListener('click', () => {
        line.materialMode = 'yo'; renderQuoteList(); renderTotal();
      });
      el.querySelector('[data-action="toggle-detail"]').addEventListener('click', () => {
        line.detailOpen = !line.detailOpen; renderQuoteList();
      });
      const qtyMinus = el.querySelector('[data-action="qty-minus"]');
      const qtyPlus = el.querySelector('[data-action="qty-plus"]');
      if(qtyMinus) qtyMinus.addEventListener('click', () => {
        line.qty = Math.max(1, line.qty - 1); renderQuoteList(); renderTotal();
      });
      if(qtyPlus) qtyPlus.addEventListener('click', () => {
        line.qty = line.qty + 1; renderQuoteList(); renderTotal();
      });
      el.querySelectorAll('[data-action="pick-material"]').forEach(chip => {
        chip.addEventListener('click', () => {
          const mat = config.materials.find(m => m.id === chip.dataset.matId);
          if(!mat) return;
          if(line.materialName === mat.name){
            // tap again to deselect / clear
            line.materialName = '';
            line.materialCost = 0;
          } else {
            line.materialName = mat.name;
            line.materialCost = mat.price;
          }
          renderQuoteList(); renderTotal();
        });
      });
      el.querySelectorAll('input[data-field]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          line[inp.dataset.field] = Number(e.target.value) || 0;
          if(inp.dataset.field === 'materialCost'){
            line.materialName = '';
            el.querySelectorAll('.material-chip.active').forEach(c => c.classList.remove('active'));
          }
          renderTotalFromDom(el, line);
          renderTotal();
        });
      });

      list.appendChild(el);
    });
  }

  function renderTotalFromDom(el, line){
    const sub = el.querySelector('.li-subtotal b');
    if(sub) sub.textContent = fmt(lineSubtotal(line));
    const matRow = el.querySelector('input[data-field="materialCost"]');
    if(matRow){
      const label = matRow.closest('.li-row').querySelector('span');
      if(label) label.textContent = line.materialName || 'Costo material';
    }
  }

  function renderTotal(){
    const total = config.baseRate + quote.reduce((sum, l) => sum + lineSubtotal(l), 0);
    $('totalDisplay').textContent = fmt(total);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Base rate inline edit ----------
  $('editBaseRateBtn').addEventListener('click', () => {
    openSettings();
    setTimeout(() => {
      $('baseRateInput').focus();
      $('baseRateInput').select();
    }, 50);
  });

  // ---------- Reset (inline two-tap confirm, no native dialogs) ----------
  let resetArmed = false;
  let resetTimer = null;
  $('resetBtn').addEventListener('click', () => {
    if(quote.length === 0) return;
    if(!resetArmed){
      resetArmed = true;
      $('resetBtn').innerHTML = '<span style="font-size:12px;font-weight:700;white-space:nowrap;">¿Seguro? Toca de nuevo</span>';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetArmed = false;
        $('resetBtn').innerHTML = RESET_ICON;
      }, 3000);
    } else {
      clearTimeout(resetTimer);
      resetArmed = false;
      $('resetBtn').innerHTML = RESET_ICON;
      quote = [];
      renderQuoteList();
      renderTotal();
      showToast('Cotización reiniciada');
    }
  });

  // ---------- Copy for WhatsApp ----------
  $('copyBtn').addEventListener('click', () => {
    if(quote.length === 0){
      showToast('Agrega al menos un servicio');
      return;
    }
    let text = '*Cotización de servicio eléctrico*\n\n';
    text += `Tarifa básica: ${fmt(config.baseRate)}\n`;
    quote.forEach(line => {
      text += `\n${line.name}`;
      if(line.qty > 1) text += ` x${line.qty}`;
      text += `\n  Mano de obra: ${fmt(line.laborPrice * line.qty)}`;
      if(line.materialMode === 'yo'){
        text += `\n  Material: ${line.materialName ? line.materialName + ' — ' : ''}${fmt(line.materialCost)}`;
      } else {
        text += `\n  Material: lo pone el cliente`;
      }
      text += `\n  Subtotal: ${fmt(lineSubtotal(line))}`;
    });
    const total = config.baseRate + quote.reduce((sum, l) => sum + lineSubtotal(l), 0);
    text += `\n\n*Total: ${fmt(total)}*`;

    copyToClipboard(text);
  });

  function copyToClipboard(text){
    // Try modern API first (needs secure context + permission)
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copiado — listo para pegar en WhatsApp');
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    // Fallback for sandboxed/insecure contexts: hidden textarea + execCommand
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try{
      ok = document.execCommand('copy');
    }catch(e){
      ok = false;
    }
    document.body.removeChild(ta);
    if(ok){
      showToast('Copiado — listo para pegar en WhatsApp');
    } else {
      showResumenModal(text);
    }
  }

  function showResumenModal(text){
    // Last resort: show the text in-page so the user can select and copy it manually
    let modal = $('resumenOverlay');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'resumenOverlay';
      modal.className = 'overlay';
      modal.innerHTML = `
        <div class="sheet">
          <div class="sheet-handle"></div>
          <h2>Selecciona y copia</h2>
          <p style="font-size:13px;color:var(--text-dim);margin-top:-8px;">Toca el texto, selecciona todo y copia manualmente.</p>
          <textarea id="resumenText" readonly style="width:100%;min-height:220px;background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:12px;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.5;"></textarea>
          <div class="sheet-footer">
            <button class="btn btn-ghost" id="closeResumenBtn" style="flex:1;">Cerrar</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if(e.target.id === 'resumenOverlay') modal.classList.remove('open'); });
      modal.querySelector('#closeResumenBtn').addEventListener('click', () => modal.classList.remove('open'));
    }
    modal.querySelector('#resumenText').value = text;
    modal.classList.add('open');
    setTimeout(() => {
      const ta = modal.querySelector('#resumenText');
      ta.focus();
      ta.select();
    }, 50);
  }

  // ---------- Settings sheet ----------
  function openSettings(){
    $('baseRateInput').value = config.baseRate;
    renderServicesEditList();
    renderMaterialsEditList();
    $('settingsOverlay').classList.add('open');
  }
  function closeSettings(){
    $('settingsOverlay').classList.remove('open');
  }
  $('openSettingsBtn').addEventListener('click', openSettings);
  $('closeSettingsBtn').addEventListener('click', closeSettings);
  $('settingsOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'settingsOverlay') closeSettings();
  });

  let draftServices = [];
  function renderServicesEditList(){
    draftServices = JSON.parse(JSON.stringify(config.services));
    paintServicesEditList();
  }
  function paintServicesEditList(){
    const container = $('servicesEditList');
    container.innerHTML = '';
    draftServices.forEach((s) => {
      const row = document.createElement('div');
      row.className = 'service-row';
      row.innerHTML = `
        <input type="text" value="${escapeHtml(s.name)}" data-id="${s.id}" data-field="name">
        <input type="number" inputmode="decimal" value="${s.price}" data-id="${s.id}" data-field="price">
        <button class="icon-btn danger" data-id="${s.id}" aria-label="Eliminar servicio">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      `;
      row.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const s2 = draftServices.find(x => x.id === e.target.dataset.id);
          if(!s2) return;
          if(e.target.dataset.field === 'name') s2.name = e.target.value;
          else s2.price = Number(e.target.value) || 0;
        });
      });
      row.querySelector('.icon-btn').addEventListener('click', () => {
        draftServices = draftServices.filter(x => x.id !== s.id);
        paintServicesEditList();
      });
      container.appendChild(row);
    });
  }

  $('addServiceBtn').addEventListener('click', () => {
    const nameInp = $('newServiceName');
    const priceInp = $('newServicePrice');
    const name = nameInp.value.trim();
    const price = Number(priceInp.value) || 0;
    if(!name){ nameInp.focus(); return; }
    draftServices.push({id: 's' + Date.now(), name, price});
    nameInp.value = ''; priceInp.value = '';
    paintServicesEditList();
  });

  let draftMaterials = [];
  function renderMaterialsEditList(){
    draftMaterials = JSON.parse(JSON.stringify(config.materials));
    paintMaterialsEditList();
  }
  function paintMaterialsEditList(){
    const container = $('materialsEditList');
    container.innerHTML = '';
    if(draftMaterials.length === 0){
      const hint = document.createElement('div');
      hint.className = 'material-hint';
      hint.style.marginTop = '0';
      hint.textContent = 'Agrega los materiales que más usas (ej. una marca de contacto) para elegirlos con un toque al cotizar.';
      container.appendChild(hint);
    }
    draftMaterials.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'service-row';
      row.innerHTML = `
        <input type="text" value="${escapeHtml(m.name)}" data-id="${m.id}" data-field="name">
        <input type="number" inputmode="decimal" value="${m.price}" data-id="${m.id}" data-field="price">
        <button class="icon-btn danger" data-id="${m.id}" aria-label="Eliminar material">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      `;
      row.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const m2 = draftMaterials.find(x => x.id === e.target.dataset.id);
          if(!m2) return;
          if(e.target.dataset.field === 'name') m2.name = e.target.value;
          else m2.price = Number(e.target.value) || 0;
        });
      });
      row.querySelector('.icon-btn').addEventListener('click', () => {
        draftMaterials = draftMaterials.filter(x => x.id !== m.id);
        paintMaterialsEditList();
      });
      container.appendChild(row);
    });
  }

  $('addMaterialBtn').addEventListener('click', () => {
    const nameInp = $('newMaterialName');
    const priceInp = $('newMaterialPrice');
    const name = nameInp.value.trim();
    const price = Number(priceInp.value) || 0;
    if(!name){ nameInp.focus(); return; }
    draftMaterials.push({id: 'm' + Date.now(), name, price});
    nameInp.value = ''; priceInp.value = '';
    paintMaterialsEditList();
  });

  $('saveSettingsBtn').addEventListener('click', async () => {
    const baseVal = Number($('baseRateInput').value);
    config.baseRate = isNaN(baseVal) ? config.baseRate : baseVal;
    config.services = draftServices.filter(s => s.name.trim() !== '');
    config.materials = draftMaterials.filter(m => m.name.trim() !== '');
    await saveConfig();
    render();
    closeSettings();
    showToast('Ajustes guardados');
  });

  loadConfig();
})();
</script>
</body>
</html>
